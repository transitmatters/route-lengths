[project]
name = "route-lengths"
version = "0.1.0"
description = "Calculate the length of MBTA routes from GTFS bundles"
authors = [{ name = "Ian Reynolds", email = "ireynolds@transitmatters.info" }]
requires-python = ">=3.12"
dependencies = [
    "mbta-gtfs-sqlite>=1.0.1,<2",
    "geopy>=2.3.0,<3",
    "tqdm>=4.66.1,<5",
]

[dependency-groups]
dev = [
    "black>=23.3.0",
]

[tool.uv]
package = false
